<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPS Scorecard — August 2026</title>
<style>
  :root {
    --green-dark:#5A0808; --green-mid:#991010; --green-light:#CC2229;
    --gold:#F5C300; --gold-light:#FFE566; --white:#ffffff;
    --off-white:#FFF8F5; --gray-light:#eae8e3; --gray-mid:#b0a898;
    --text-dark:#1a1a1a; --text-mid:#444; --red:#8B0000; --calc-bg:#FFFDE8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--off-white);color:var(--text-dark);min-height:100vh;}
  .header{background:linear-gradient(135deg,#1a1a1a 0%,#4A0808 100%);color:var(--white);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:3px solid var(--gold);}
  .header h1{font-size:20px;font-weight:700;color:var(--gold-light);}
  .header .subtitle{font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px;letter-spacing:0.8px;text-transform:uppercase;}
  .btn{padding:7px 16px;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;}
  .btn-ghost{background:rgba(255,255,255,0.12);color:var(--white);border:1px solid rgba(255,255,255,0.25);}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}
  .sc-type-bar{background:var(--green-dark);padding:0 32px;display:flex;gap:0;border-bottom:2px solid var(--gold);}
  .sc-tab{padding:11px 20px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all 0.15s;letter-spacing:0.3px;}
  .sc-tab:hover{color:var(--gold-light);}
  .sc-tab.active{color:var(--gold-light);border-bottom-color:var(--gold);}
  .tab-bar{background:var(--white);border-bottom:2px solid var(--gray-light);padding:0 32px;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;}
  .tab{padding:11px 20px;font-size:13px;font-weight:600;color:var(--gray-mid);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all 0.15s;letter-spacing:0.3px;}
  .tab:hover{color:var(--green-light);}
  .tab.active{color:var(--green-dark);border-bottom-color:var(--green-light);}
  .tab.mtd-tab.active{color:#7a5c00;border-bottom-color:var(--gold);}
  .tab-date{font-size:11px;font-weight:400;color:var(--gray-mid);margin-top:2px;}
  .tab.active .tab-date{color:var(--green-mid);}
  .tab.mtd-tab.active .tab-date{color:#b08020;}
  .mtd-badge{background:var(--gold);color:#1a1a1a;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;}
  .content{padding:22px 32px;}
  .period-label{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .period-label h2{font-size:16px;font-weight:700;color:var(--green-mid);}
  .period-label .period-sub{font-size:12px;color:var(--gray-mid);}
  .mtd-pill{background:var(--gold);color:#1a1a1a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.5px;}
  .formula-bar{background:var(--white);border:1px solid var(--gray-light);border-radius:8px;padding:9px 16px;margin-bottom:16px;font-size:13px;color:var(--text-mid);}
  .formula-bar strong{color:var(--green-mid);font-size:12px;letter-spacing:0.5px;text-transform:uppercase;margin-right:8px;}
  .table-wrap{background:var(--white);border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,0.07);overflow:hidden;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:700px;}
  thead tr.col-header{background:var(--green-dark);}
  thead tr.col-header th{padding:12px 13px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);text-align:center;border-right:1px solid rgba(255,255,255,0.1);white-space:nowrap;letter-spacing:0.3px;}
  thead tr.col-header th:first-child{text-align:left;min-width:160px;color:var(--gold-light);}
  thead tr.col-header th.calc-head{background:rgba(245,195,0,0.25);}
  thead tr.col-header th.err-head{background:rgba(192,57,43,0.3);color:rgba(255,200,190,0.9);}
  thead tr.col-header th.warn-head{background:rgba(180,120,0,0.35);color:rgba(255,230,150,0.9);}
  thead tr.col-header th.good-head{background:rgba(0,120,60,0.35);color:rgba(180,255,200,0.9);}
  tbody tr{border-bottom:1px solid var(--gray-light);transition:background 0.1s;}
  tbody tr:hover{background:#FFF5F5;}
  td{padding:10px 13px;font-size:13px;text-align:center;border-right:1px solid var(--gray-light);vertical-align:middle;}
  td.name-cell{text-align:left;font-weight:600;border-right:2px solid var(--gray-light);}
  td.num-cell{font-weight:500;color:var(--text-mid);}
  td.num-cell.zero{color:#ccc;}
  td.calc-cell{background:var(--calc-bg);font-weight:700;color:#7A5C00;}
  td.err-cell{background:#fdf0ee;font-weight:700;color:var(--red);}
  td.warn-cell{background:#fdf8ee;font-weight:700;color:#7a5c00;}
  td.good-cell{background:#edfaf3;font-weight:700;color:#1a6a3e;}
  td.na-cell{color:#bbb;font-style:italic;font-size:12px;}
  tfoot tr{background:var(--green-dark)!important;border-top:2px solid var(--gold);}
  tfoot td{padding:10px 13px;color:rgba(255,255,255,0.9);font-weight:700;border-right-color:rgba(255,255,255,0.1);}
  tfoot td.name-cell{color:var(--gold-light);font-size:12px;letter-spacing:0.8px;text-transform:uppercase;border-right-color:rgba(255,255,255,0.2);}
  tfoot td.calc-cell{background:rgba(245,195,0,0.2);color:var(--gold-light);}
  tfoot td.err-cell{background:rgba(192,57,43,0.25);color:#ffb3aa;}
  tfoot td.good-cell{background:rgba(0,120,60,0.2);color:rgba(160,255,190,0.9);}
  .scorecard-section{display:none;}
  .scorecard-section.active{display:block;}
  .no-data{text-align:center;color:var(--gray-mid);padding:48px 24px;font-style:italic;font-size:14px;background:var(--white);border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,0.07);}
  .vault-balanced-yes{color:#1a6a3e;font-weight:700;}
  .vault-balanced-no{color:var(--red);font-weight:700;}
  .vault-balanced-partial{color:#8a6000;font-weight:700;}
  @media print{
    .header .btn,.sc-type-bar,.tab-bar,.formula-bar{display:none!important;}
    .content{padding:8px;}
    body{background:white;}
    .header,thead tr.col-header,tfoot tr{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  .hit{background:rgba(76,175,80,0.16)!important;}
  .bonus-cell{font-weight:700;}
</style>
</head>

function fmtVal(v,f){return f==='pct'?pct(v,1):f==='pct2'?pct(v,2):num1(v);}
function isHit(v,c){return v!==null&&v!==undefined&&(c.dir==='hi'?v>=c.full:v<=c.full);}
function bonusFor(hits){return hits>=2?Math.min(hits,4)*100:0;}
function renderScorecard(key,p){
  const cfg=SC_CONFIG[key];
  updatePeriodLabel(cfg.pfx,p);
  const el=document.getElementById(cfg.pfx+'-body');
  if(!cfg.cols.length||!cfg.seed.length){noData(el);return;}
  const isMTD=p===5;
  const rows=cfg.seed.map(s=>({name:s.name,d:(isMTD?s.mtd:s.wk[p])||[null,null,null,null]}));
  rows.forEach(r=>{
    r.hits=cfg.cols.reduce((a,c,i)=>a+(isHit(r.d[i],c)?1:0),0);
    r.hasData=r.d.some(v=>v!==null&&v!==undefined);
    r.bonus=bonusFor(r.hits);
  });
  if(isMTD) rows.sort((a,b)=>b.bonus-a.bonus||b.hits-a.hits||a.name.localeCompare(b.name));
  else rows.sort((a,b)=>a.name.localeCompare(b.name));
  let h=`<div class="table-wrap"><table><thead><tr class="col-header"><th>${cfg.person}</th>`;
  for(const c of cfg.cols) h+=`<th class="${c.head}">${c.label}<br><span style="font-weight:400;opacity:0.75;">(target ${c.dir==='hi'?'&ge;':'&le;'} ${fmtVal(c.full,c.fmt==='pct2'?'pct':c.fmt)})</span></th>`;
  if(isMTD) h+=`<th class="calc-head">Metrics Hit<br>(full target)</th><th class="calc-head">Projected<br>Monthly Bonus</th>`;
  h+='</tr></thead><tbody>';
  for(const r of rows){
    h+='<tr>'+`<td class="name-cell">${r.name}</td>`;
    r.d.forEach((v,i)=>{
      const hit=isHit(v,cfg.cols[i]);
      h+=`<td class="num-cell${zc(v)}${hit?' hit':''}">${fmtVal(v,cfg.cols[i].fmt)}</td>`;
    });
    if(isMTD){
      h+=`<td class="num-cell">${r.hasData?r.hits+' / '+cfg.cols.length:'\u2014'}</td>`;
      h+=`<td class="num-cell bonus-cell${r.bonus?'':' zero'}">${r.hasData?'$'+r.bonus:'\u2014'}</td>`;
    }
    h+='</tr>';
  }
  h+='</tbody><tfoot><tr><td class="name-cell">'+(isMTD?'MTD ':'Team ')+'Average</td>';
  cfg.cols.forEach((c,i)=>{
    const vals=rows.map(r=>r.d[i]).filter(v=>v!==null&&v!==undefined);
    let out='\u2014';
    if(vals.length){
      const agg=c.foot==='sum'?vals.reduce((a,b)=>a+b,0):vals.reduce((a,b)=>a+b,0)/vals.length;
      out=fmtVal(agg,c.fmt);
    }
    h+=`<td>${out}</td>`;
  });
  if(isMTD){
    const dr=rows.filter(r=>r.hasData);
    h+=`<td>${dr.length?(dr.reduce((a,r)=>a+r.hits,0)/dr.length).toFixed(1):'\u2014'}</td>`;
    h+=`<td>$${dr.reduce((a,r)=>a+r.bonus,0).toLocaleString()}</td>`;
  }
  h+='</tr></tfoot></table></div>';
  el.innerHTML=h;
}

  document.querySelectorAll('.sc-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.scorecard-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc-'+name).classList.add('active');
  if(name==='lastaudit'){renderLastAudit();return;}
  renderScorecard(name,periods[name]);
}
function selectPeriod(sc,p,btn){
  periods[sc]=p;
  document.getElementById('sc-'+sc).querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderScorecard(sc,p);
}

function selectRegion(r,btn){
  laRegion=r;
  document.getElementById('sc-lastaudit').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderLastAudit();
}
function renderLastAudit(){
  if(laRegion==='Summary'){
    document.getElementById('la-title').innerHTML='Last Audit &mdash; Region Summary';
    document.getElementById('la-sub').textContent='Audit compliance by region \u00b7 as of '+AUDIT_ASOF;
    let tl=0,tc=0;
    let h=`<div class="table-wrap"><table>
      <thead><tr class="col-header">
        <th style="text-align:left;">Region</th>
        <th>Total<br>Locations</th>
        <th>Total Audit Compliant<br>Locations</th>
        <th class="calc-head">Compliant %</th>
      </tr></thead><tbody>`;
    for(const r of REGION_SUMMARY){
      tl+=r[1];tc+=r[2];
      h+=`<tr><td style="text-align:left;">${esc(r[0])}</td><td>${n(r[1])}</td><td>${n(r[2])}</td><td class="calc-cell">${pct(r[3],1)}</td></tr>`;
    }
    h+=`</tbody><tfoot><tr><td class="name-cell" style="text-align:left;">Total</td><td>${n(tl)}</td><td>${n(tc)}</td><td>${pct(tl>0?tc/tl:0,1)}</td></tr></tfoot></table></div>`;
    document.getElementById('la-body').innerHTML=h;
    return;
  }
  const rows=laRegion==='All'?AUDIT_SEED:AUDIT_SEED.filter(r=>r[3]===laRegion);
  document.getElementById('la-title').innerHTML='Last Audit &mdash; '+(laRegion==='All'?'All Regions':laRegion+' Region');
  document.getElementById('la-sub').textContent=rows.length+' locations \u00b7 as of '+AUDIT_ASOF;
  let h=`<div class="table-wrap"><table>
    <thead><tr class="col-header">
      <th style="text-align:left;">Location Name</th>
      <th style="text-align:left;">Corporation Name</th>
      <th>Location<br>License</th>
      <th>Region<br>Name</th>
      <th style="text-align:left;">New Region</th>
      <th>GL Date</th>
      <th>Last Audit<br>Date in 2026</th>
      <th class="err-head">Days Since<br>Last Audit</th>
    </tr></thead><tbody>`;
  for(const r of rows){
    const days=r[7], flag=String(days).endsWith('+'), na=(r[6]===''||r[6]==='NA');
    h+=`<tr>
      <td style="text-align:left;">${esc(r[0])}</td>
      <td style="text-align:left;">${esc(r[1])}</td>
      <td>${esc(r[2])}</td>
      <td>${esc(r[3])}</td>
      <td style="text-align:left;">${esc(r[4])}</td>
      <td>${esc(r[5])}</td>
      <td${na?' class="zero"':''}>${na?'\u2014':esc(r[6])}</td>
      <td${flag?' style="color:#c0392b;font-weight:600;"':''}>${esc(days)}</td>
    </tr>`;
  }
  h+=`</tbody></table></div>`;
  document.getElementById('la-body').innerHTML=h;
}
